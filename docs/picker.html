<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>縦書き — 文書へのアクセスの許可 / Allow access</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; padding: 32px 24px; color: #1f1f1f; background: #fff; }
  main { max-width: 560px; margin: 0 auto; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  p { font-size: 14px; line-height: 1.7; color: #444; margin: 0 0 8px; }
  button { margin-top: 16px; padding: 10px 20px; font-size: 14px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
  button[hidden] { display: none; }
  #status { margin-top: 20px; font-size: 13px; color: #666; }
  #status.error { color: #b3261e; }
</style>
</head>
<body>
<main>
  <h1 data-ja="この文書への書き込みを許可してください" data-en="Allow access to your document">この文書への書き込みを許可してください</h1>
  <p data-ja="「縦書き」が、いま開いている文書だけを読み書きできるようにします。表示された文書の行をクリックして選び、「選択」を押してください。"
     data-en="This lets the extension read and write only the document you have open. Click the document row in the dialog, then click Select.">
    「縦書き」が、いま開いている文書だけを読み書きできるようにします。表示された文書の行をクリックして選び、「選択」を押してください。
  </p>
  <p data-ja="ほかのファイルには一切アクセスしません。" data-en="No other files are accessed.">ほかのファイルには一切アクセスしません。</p>
  <button id="retry" hidden data-ja="もう一度開く" data-en="Open again">もう一度開く</button>
  <div id="status" role="status"></div>
</main>

<script>
// 公開してよい値。API キーは Google Picker API 専用・このページからの利用だけに制限する。
// Cloud プロジェクトの番号は、選んだ文書へのアクセスの許可をこのアプリに結びつけるために Picker に渡す。
var PICKER_API_KEY = 'AIzaSyAcorJzhdaBSGxFKNXVlSgJ84xzZmFK88w';
var CLOUD_PROJECT_NUMBER = '603751886362';

var params = new URLSearchParams(location.search);
var extId = params.get('ext');
var fileId = params.get('fileId');
var lang = (navigator.language || 'en').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en';
document.documentElement.lang = lang;
document.querySelectorAll('[data-ja]').forEach(function (el) {
  el.textContent = el.getAttribute('data-' + lang);
});

var statusEl = document.getElementById('status');
var retryBtn = document.getElementById('retry');
function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.className = isError ? 'error' : '';
}
function msg(ja, en) {
  return lang === 'ja' ? ja : en;
}

function sendToExtension(message) {
  return new Promise(function (resolve, reject) {
    if (!window.chrome || !chrome.runtime || !chrome.runtime.sendMessage) {
      reject(new Error(msg('拡張機能と通信できません。拡張機能から開いてください。', 'Cannot reach the extension. Please open this page from the extension.')));
      return;
    }
    chrome.runtime.sendMessage(extId, message, function (response) {
      if (chrome.runtime.lastError) reject(new Error(chrome.runtime.lastError.message));
      else resolve(response);
    });
  });
}

// 結果を知らせると、拡張機能がこのウィンドウを閉じる。
function finish(granted) {
  sendToExtension({ type: 'tategaki/picker-result', fileId: fileId, granted: granted }).catch(function () {});
}

function loadPickerLibrary() {
  return new Promise(function (resolve, reject) {
    var script = document.createElement('script');
    script.src = 'https://apis.google.com/js/api.js';
    script.onload = function () {
      gapi.load('picker', { callback: resolve, onerror: reject });
    };
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

function openPicker(token) {
  var view = new google.picker.DocsView(google.picker.ViewId.DOCUMENTS).setFileIds(fileId).setMode(google.picker.DocsViewMode.LIST);
  var picker = new google.picker.PickerBuilder()
    .addView(view)
    .setOAuthToken(token)
    .setDeveloperKey(PICKER_API_KEY)
    .setAppId(CLOUD_PROJECT_NUMBER)
    .setOrigin(location.protocol + '//' + location.host)
    .setLocale(lang)
    .setTitle(msg('文書を選択', 'Select the document'))
    .setCallback(function (data) {
      var action = data[google.picker.Response.ACTION];
      if (action === google.picker.Action.PICKED) {
        var docs = data[google.picker.Response.DOCUMENTS] || [];
        var granted = docs.some(function (d) { return d[google.picker.Document.ID] === fileId; });
        if (granted) {
          setStatus(msg('許可されました。このウィンドウは自動で閉じます。', 'Access granted. This window will close automatically.'));
          finish(true);
        } else {
          setStatus(msg('いま開いている文書を選んでください。', 'Please select the document you have open.'), true);
          retryBtn.hidden = false;
        }
      } else if (action === google.picker.Action.CANCEL) {
        finish(false);
      }
    })
    .build();
  picker.setVisible(true);
}

async function start() {
  retryBtn.hidden = true;
  if (!extId || !fileId) {
    setStatus(msg('拡張機能から開いてください。', 'Please open this page from the extension.'), true);
    return;
  }
  if (!PICKER_API_KEY) {
    setStatus(msg('この機能は、まだ準備中です。', 'This feature is not available yet.'), true);
    return;
  }
  setStatus(msg('準備しています…', 'Getting ready…'));
  try {
    await loadPickerLibrary();
    var res = await sendToExtension({ type: 'tategaki/picker-get-token' });
    if (!res || !res.ok || !res.token) {
      throw new Error((res && res.message) || msg('アクセスの許可を取得できませんでした。', 'Could not get authorization.'));
    }
    setStatus('');
    openPicker(res.token);
  } catch (err) {
    setStatus(String((err && err.message) || err), true);
    retryBtn.hidden = false;
  }
}

retryBtn.addEventListener('click', start);
start();
</script>
</body>
</html>
